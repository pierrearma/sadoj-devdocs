  <style>
    :root {
      --theme-color: #3498db;
    }

    /* Alignement horizontal du logo et du texte */
    .sidebar .app-name-link {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .sidebar .app-name-link img {
      display: inline-block;
      margin-right: 0.5em;
    }

    /* Adaptation de docsify-tabs au thème sombre */
    html[data-theme="dark"] {
      --docsifytabs-border-color: #30363d;
      --docsifytabs-tab-background: #161b22;
      --docsifytabs-tab-background--active: var(--color-bg, #1f2428);
      --docsifytabs-tab-color: #8b949e;
      --docsifytabs-tab-color--active: var(--color-text, #ddd);
      --docsifytabs-tab-highlight-color: var(--theme-color, #3498db);
      --docsifytabs-content-background: var(--color-bg, #1f2428);
    }
  </style>

  <!-- Gestionnaire de thème sombre / clair -->
  <script src="theme-switcher.js"></script>

<body class="sidebar-chevron-right">
  <div id="app">Chargement...</div>

  <!-- Edit on github -->
  <script src="//cdn.jsdelivr.net/npm/docsify-edit-on-github"></script>

  <script>
    window.$docsify = {
      name: '<img style="vertical-align:middle; margin-right:0.5em;" src="_media/logo_300px.png" alt="" width="75"/>SADoJ Dev Docs',
      // repo: 'https://github.com/pierrearma/sadoj-devdocs',
      loadNavbar: true,
      loadSidebar: true,
      homepage: 'index.md',
      subMaxLevel: 0,
      toc: {
        title: 'Sur cette page',
        headings: 'h2, h3'
      },
      alias: {
        '/.*/_navbar.md': '/_navbar.md',
        '/.*/_sidebar.md': '/_sidebar.md'
      },
      formatUpdated: 'Dernière mise à jour de cette page le {DD}/{MM}/{YYYY} à {HH}:{mm}.',
      search: {
        placeholder: 'Tapez pour rechercher',
        noData: 'Aucun résultat !'
      },
      copyCode: {
        buttonText: 'Copier',
        errorText: 'Erreur',
        successText: 'Copié'
      },
      pagination: {
        previousText: 'PRÉCÉDENT',
        nextText: 'SUIVANT'
      },
      'flexible-alerts': {
        note: {
          label: "Remarque"
        },
        tip: {
          label: "Conseil"
        },
        warning: {
          label: "Avertissement"
        },
        attention: {
          label: "Attention"
        }
      },
      footer: {
        copy: '<span>SADoJ Dev Docs &copy; 2026</span>',
        auth: ' - <span>Réalisé par <a href="https://sadoj-rp.fr/user/pierre/" target="_blank">Pierre</a>.</span>',
      },
      plugins: [
        EditOnGithubPlugin.create("https://github.com/pierrearma/sadoj-devdocs/blob/main/", null, "Éditer sur github")
      ]
    }
  </script>

  <!-- Docsify v5 -->
  <script src="//cdn.jsdelivr.net/npm/docsify@5/dist/docsify.min.js"></script>

  <!-- Copy code block -->

  <!-- Pagination -->

  <!-- Zoom image -->

  <!-- Flexible alerts -->
